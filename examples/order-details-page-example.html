<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Order Details - API Integration Example</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light">
    <div class="container mt-5">
        <h1>Order Details</h1>
        <div id="loading" class="text-center"><div class="spinner-border"></div><p>Loading order details...</p></div>
        <div id="order-details" style="display: none;"></div>
    </div>

    <script src="../js/api.js"></script>
    <script>
        async function loadOrderDetails() {
            try {
                const urlParams = new URLSearchParams(window.location.search);
                const orderId = urlParams.get('id');
                if (!orderId) { alert('Invalid order ID'); window.location.href = '/my-orders.html'; return; }
                if (!isUserLoggedIn()) { alert('Please log in first'); window.location.href = '/login.html'; return; }
                const order = await fetchOrderDetails(orderId);
                if (!order) { alert('Order not found'); window.location.href = '/my-orders.html'; return; }
                
                const html = `<div class="row"><div class="col-md-8"><div class="card mb-3"><div class="card-header"><h5>Order #${order.id}</h5></div><div class="card-body"><p><strong>Status:</strong> <span class="badge ${getStatusBadge(order.status)}">${order.status}</span></p><p><strong>Date:</strong> ${new Date(order.date).toLocaleDateString()}</p><h6 class="mt-3">Items:</h6><table class="table table-sm"><thead><tr><th>Product</th><th>Quantity</th><th>Price</th><th>Subtotal</th></tr></thead><tbody>${order.items.map(item => `<tr><td>${item.name}</td><td>${item.quantity}</td><td>$${item.price.toFixed(2)}</td><td>$${(item.quantity * item.price).toFixed(2)}</td></tr>`).join('')}</tbody></table></div></div><div class="card"><div class="card-header"><h5>Shipping Address</h5></div><div class="card-body"><p>${order.shipping.fullName}</p><p>${order.shipping.address}</p><p>${order.shipping.city}, ${order.shipping.zipcode}</p></div></div></div><div class="col-md-4"><div class="card"><div class="card-header"><h5>Order Summary</h5></div><div class="card-body"><p><strong>Subtotal:</strong> $${order.subtotal.toFixed(2)}</p><p><strong>Shipping:</strong> $${order.shipping_cost.toFixed(2)}</p><p><strong>Tax:</strong> $${order.tax.toFixed(2)}</p><hr><h5><strong>Total:</strong> $${order.total.toFixed(2)}</h5></div></div><a href="/my-orders.html" class="btn btn-secondary w-100 mt-3">Back to Orders</a></div></div>`;
                document.getElementById('order-details').innerHTML = html;
                document.getElementById('loading').style.display = 'none';
                document.getElementById('order-details').style.display = 'block';
            } catch (error) { console.error('Error loading order:', error); alert('Failed to load order details'); }
        }
        function getStatusBadge(status) { const badges = { 'pending': 'bg-warning', 'processing': 'bg-info', 'shipped': 'bg-primary', 'delivered': 'bg-success', 'cancelled': 'bg-danger' }; return badges[status] || 'bg-secondary'; }
        window.addEventListener('DOMContentLoaded', loadOrderDetails);
    </script>
</body>
</html>
