<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cart - API Integration Example</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light">
    <div class="container mt-5">
        <h1>Shopping Cart</h1>
        <div id="loading" class="text-center"><div class="spinner-border"></div><p>Loading cart...</p></div>
        <div id="cart-content" style="display: none;">
            <div class="row"><div class="col-md-8"><div class="card"><div class="card-header"><h5>Cart Items</h5></div><div class="card-body"><table class="table"><thead><tr><th>Product</th><th>Price</th><th>Quantity</th><th>Subtotal</th><th>Action</th></tr></thead><tbody id="cart-items"></tbody></table></div></div></div>
            <div class="col-md-4"><div class="card"><div class="card-header"><h5>Order Summary</h5></div><div class="card-body"><p><strong>Subtotal:</strong> <span id="subtotal">$0.00</span></p><p><strong>Shipping:</strong> <span id="shipping">$0.00</span></p><p><strong>Tax:</strong> <span id="tax">$0.00</span></p><hr><h5><strong>Total:</strong> <span id="total">$0.00</span></h5><button class="btn btn-success w-100 mt-3" onclick="proceedToCheckout()">Proceed to Checkout</button><a href="/shop.html" class="btn btn-secondary w-100 mt-2">Continue Shopping</a></div></div></div></div>
        </div>
        <div id="empty-cart" class="alert alert-info" style="display: none;"><h4>Your cart is empty</h4><p>Start shopping to add items to your cart.</p><a href="/shop.html" class="btn btn-primary">Go to Shop</a></div>
    </div>

    <script src="../js/api.js"></script>
    <script>
        async function loadCart() {
            try {
                if (!isUserLoggedIn()) { alert('Please log in first'); window.location.href = '/login.html'; return; }
                const cartData = await fetchCart();
                if (!cartData || !cartData.items || cartData.items.length === 0) { document.getElementById('loading').style.display = 'none'; document.getElementById('empty-cart').style.display = 'block'; return; }
                let html = ''; let subtotal = 0;
                cartData.items.forEach(item => {
                    const itemSubtotal = item.price * item.quantity; subtotal += itemSubtotal;
                    html += `<tr><td>${item.name}</td><td>$${item.price.toFixed(2)}</td><td><input type="number" value="${item.quantity}" min="1" onchange="updateQuantity(${item.id}, this.value)" class="form-control" style="width: 80px;"></td><td>$${itemSubtotal.toFixed(2)}</td><td><button class="btn btn-sm btn-danger" onclick="removeItem(${item.id})">Remove</button></td></tr>`;
                });
                document.getElementById('cart-items').innerHTML = html;
                const shipping = 10.00; const tax = subtotal * 0.1; const total = subtotal + shipping + tax;
                document.getElementById('subtotal').textContent = `$${subtotal.toFixed(2)}`;
                document.getElementById('shipping').textContent = `$${shipping.toFixed(2)}`;
                document.getElementById('tax').textContent = `$${tax.toFixed(2)}`;
                document.getElementById('total').textContent = `$${total.toFixed(2)}`;
                document.getElementById('loading').style.display = 'none';
                document.getElementById('cart-content').style.display = 'block';
            } catch (error) { console.error('Error loading cart:', error); alert('Failed to load cart'); }
        }
        async function updateQuantity(productId, newQuantity) { const result = await updateCartQuantity(productId, parseInt(newQuantity)); if (result) { loadCart(); } }
        async function removeItem(productId) { if (confirm('Remove this item from cart?')) { const result = await removeFromCart(productId); if (result) { loadCart(); } } }
        function proceedToCheckout() { window.location.href = '/checkout.html'; }
        window.addEventListener('DOMContentLoaded', loadCart);
    </script>
</body>
</html>
