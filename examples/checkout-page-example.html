<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Checkout - API Integration Example</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light">
    <div class="container mt-5">
        <h1>Checkout</h1>
        <div class="row">
            <div class="col-md-6"><div class="card"><div class="card-header"><h5>Order Summary</h5></div><div class="card-body"><div id="cart-items"></div><hr><h5>Total: $<span id="total">0.00</span></h5></div></div></div>
            <div class="col-md-6"><div class="card"><div class="card-header"><h5>Shipping & Payment</h5></div><div class="card-body"><form id="checkoutForm">
                <h6>Shipping Address</h6>
                <div class="mb-3"><label for="fullName" class="form-label">Full Name</label><input type="text" class="form-control" id="fullName" required></div>
                <div class="mb-3"><label for="address" class="form-label">Address</label><input type="text" class="form-control" id="address" required></div>
                <div class="row"><div class="col-md-6 mb-3"><label for="city" class="form-label">City</label><input type="text" class="form-control" id="city" required></div><div class="col-md-6 mb-3"><label for="zipcode" class="form-label">Zip Code</label><input type="text" class="form-control" id="zipcode" required></div></div>
                <hr>
                <h6>Payment Information</h6>
                <div class="mb-3"><label for="cardName" class="form-label">Cardholder Name</label><input type="text" class="form-control" id="cardName" required></div>
                <div class="mb-3"><label for="cardNumber" class="form-label">Card Number</label><input type="text" class="form-control" id="cardNumber" placeholder="1234 5678 9012 3456" required></div>
                <div class="row"><div class="col-md-6 mb-3"><label for="expiry" class="form-label">Expiry Date</label><input type="text" class="form-control" id="expiry" placeholder="MM/YY" required></div><div class="col-md-6 mb-3"><label for="cvv" class="form-label">CVV</label><input type="text" class="form-control" id="cvv" placeholder="123" required></div></div>
                <div id="error" class="alert alert-danger" style="display: none;"></div>
                <div id="success" class="alert alert-success" style="display: none;"></div>
                <button type="submit" class="btn btn-success w-100" id="submitBtn">Place Order</button>
            </form></div></div></div>
        </div>
    </div>

    <script src="../js/api.js"></script>
    <script>
        const checkoutForm = document.getElementById('checkoutForm');
        const errorDiv = document.getElementById('error');
        const successDiv = document.getElementById('success');
        const submitBtn = document.getElementById('submitBtn');
        
        async function loadCart() {
            try {
                if (!isUserLoggedIn()) { alert('Please log in first'); window.location.href = '/login.html'; return; }
                const cartData = await fetchCart();
                if (cartData && cartData.items) {
                    let html = ''; let total = 0;
                    cartData.items.forEach(item => {
                        const subtotal = item.price * item.quantity; total += subtotal;
                        html += `<div class="d-flex justify-content-between mb-2"><span>${item.name} x${item.quantity}</span><span>$${subtotal.toFixed(2)}</span></div>`;
                    });
                    document.getElementById('cart-items').innerHTML = html;
                    document.getElementById('total').textContent = total.toFixed(2);
                }
            } catch (error) { console.error('Error loading cart:', error); }
        }
        
        checkoutForm.addEventListener('submit', async (e) => {
            e.preventDefault();
            errorDiv.style.display = 'none';
            successDiv.style.display = 'none';
            submitBtn.disabled = true;
            submitBtn.innerHTML = '<span class="spinner-border spinner-border-sm me-2"></span>Processing...';
            
            try {
                const orderData = { shipping: { fullName: document.getElementById('fullName').value, address: document.getElementById('address').value, city: document.getElementById('city').value, zipcode: document.getElementById('zipcode').value } };
                const order = await createOrder(orderData);
                if (!order) throw new Error('Failed to create order');
                
                const paymentData = { orderId: order.id, cardName: document.getElementById('cardName').value, cardNumber: document.getElementById('cardNumber').value, expiry: document.getElementById('expiry').value, cvv: document.getElementById('cvv').value, amount: document.getElementById('total').textContent };
                const paymentResult = await processPayment(paymentData);
                if (!paymentResult) throw new Error('Payment failed');
                
                successDiv.style.display = 'block';
                successDiv.textContent = 'Order placed successfully! Redirecting...';
                setTimeout(() => { window.location.href = `/thank-you.html?orderId=${order.id}`; }, 2000);
            } catch (error) {
                errorDiv.style.display = 'block';
                errorDiv.textContent = error.message || 'Checkout failed';
                submitBtn.disabled = false;
                submitBtn.innerHTML = 'Place Order';
            }
        });
        
        window.addEventListener('DOMContentLoaded', loadCart);
    </script>
</body>
</html>
