<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>My Orders - API Integration Example</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light">
    <div class="container mt-5">
        <h1>My Orders</h1>
        <div id="loading" class="text-center"><div class="spinner-border"></div><p>Loading your orders...</p></div>
        <div id="orders-container" style="display: none;"></div>
        <div id="no-orders" class="alert alert-info" style="display: none;">You haven't placed any orders yet. <a href="/shop.html" class="alert-link">Start shopping</a></div>
    </div>

    <script src="../js/api.js"></script>
    <script>
        async function loadMyOrders() {
            try {
                if (!isUserLoggedIn()) { alert('Please log in first'); window.location.href = '/login.html'; return; }
                const orders = await fetchUserOrders();
                if (!orders || orders.length === 0) { document.getElementById('loading').style.display = 'none'; document.getElementById('no-orders').style.display = 'block'; return; }
                let html = '';
                orders.forEach(order => {
                    html += `<div class="card mb-3"><div class="card-body"><div class="row"><div class="col-md-6"><h5>Order #${order.id}</h5><p><strong>Date:</strong> ${new Date(order.date).toLocaleDateString()}</p><p><strong>Status:</strong> <span class="badge ${getStatusBadge(order.status)}">${order.status}</span></p></div><div class="col-md-6 text-end"><h5>$${order.total.toFixed(2)}</h5><button class="btn btn-sm btn-primary" onclick="viewOrderDetails(${order.id})">View Details</button></div></div></div></div>`;
                });
                document.getElementById('orders-container').innerHTML = html;
                document.getElementById('loading').style.display = 'none';
                document.getElementById('orders-container').style.display = 'block';
            } catch (error) { console.error('Error loading orders:', error); alert('Failed to load orders'); }
        }
        function getStatusBadge(status) { const badges = { 'pending': 'bg-warning', 'processing': 'bg-info', 'shipped': 'bg-primary', 'delivered': 'bg-success', 'cancelled': 'bg-danger' }; return badges[status] || 'bg-secondary'; }
        function viewOrderDetails(orderId) { window.location.href = `/order-details.html?id=${orderId}`; }
        window.addEventListener('DOMContentLoaded', loadMyOrders);
    </script>
</body>
</html>
