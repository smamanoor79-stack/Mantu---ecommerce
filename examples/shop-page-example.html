<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Shop - API Integration Example</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body>
    <div class="container mt-5">
        <h1>Shop - Loading Products from Backend</h1>
        
        <div id="loading" class="text-center">
            <div class="spinner-border" role="status"><span class="visually-hidden">Loading...</span></div>
            <p>Loading products...</p>
        </div>
        
        <div id="products-container" class="row" style="display: none;"></div>
        <div id="error" class="alert alert-danger" style="display: none;"></div>
    </div>

    <script src="../js/api.js"></script>
    <script>
        async function loadProducts() {
            const loadingDiv = document.getElementById('loading');
            const productsContainer = document.getElementById('products-container');
            const errorDiv = document.getElementById('error');
            
            try {
                const products = await fetchProducts();
                
                if (!products || products.length === 0) {
                    errorDiv.textContent = 'No products found';
                    errorDiv.style.display = 'block';
                    loadingDiv.style.display = 'none';
                    return;
                }
                
                let html = '';
                products.forEach(product => {
                    html += `<div class="col-md-4 mb-4"><div class="card"><img src="${product.image}" class="card-img-top" alt="${product.name}"><div class="card-body"><h5 class="card-title">${product.name}</h5><p class="card-text">${product.description}</p><h6>$${product.price}</h6><button class="btn btn-primary" onclick="addProductToCart(${product.id})">Add to Cart</button></div></div></div>`;
                });
                
                productsContainer.innerHTML = html;
                loadingDiv.style.display = 'none';
                productsContainer.style.display = 'flex';
                
            } catch (error) {
                console.error('Error loading products:', error);
                errorDiv.textContent = 'Failed to load products. Please try again.';
                errorDiv.style.display = 'block';
                loadingDiv.style.display = 'none';
            }
        }
        
        async function addProductToCart(productId) {
            if (!isUserLoggedIn()) {
                alert('Please log in first');
                window.location.href = '/login.html';
                return;
            }
            const result = await addToCart(productId, 1);
            if (result) { alert('Product added to cart!'); } else { alert('Failed to add to cart'); }
        }
        
        window.addEventListener('DOMContentLoaded', loadProducts);
    </script>
</body>
</html>
